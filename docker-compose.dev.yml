services:
  postgres:
    image: postgres:16
    ports:
      - 5433:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal_development
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - 3100:3000
    command:
      - 'gotenberg'
      - '--api-timeout=120s'

volumes:
  pg_data:
